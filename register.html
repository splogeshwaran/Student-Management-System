<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Management System</h1>
<h3>Create your account to start a learning path</h3>

<form id="registerForm" novalidate>

    <div class="field" id="nameField">
        <label for="fullname">Full Name</label>
        <input type="text" id="fullname" placeholder="Enter your full name" required>
        <div class="error-text">Please enter your full name.</div>
    </div>

    <div class="field" id="emailField">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <div class="error-text">Please enter a valid email address.</div>
    </div>

    <div class="field" id="rollField">
        <label for="roll">Roll Number</label>
        <input type="text" id="roll" placeholder="Enter your roll number" required>
        <div class="error-text">Please enter your roll number.</div>
    </div>

    <div class="field" id="passField">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Create a password" required>
        <div class="error-text">Password must be at least 6 characters.</div>
    </div>

    <button type="submit">Register</button>
    <a class="btn" href="login.html">Already have an account</a>
</form>

<script src="toast.js"></script>
<script>

document.getElementById("registerForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const fields = {
        nameField: document.getElementById("fullname").value.trim().length > 0,
        emailField: /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(document.getElementById("email").value.trim()),
        rollField: document.getElementById("roll").value.trim().length > 0,
        passField: document.getElementById("password").value.length >= 6
    };

    let valid = true;

    Object.keys(fields).forEach(function (id) {
        const el = document.getElementById(id);
        if (fields[id]) {
            el.classList.remove("invalid");
        } else {
            el.classList.add("invalid");
            valid = false;
        }
    });

    if (!valid) {
        showToast("Please fix the highlighted fields.", "error");
        return;
    }

    showToast("Account created successfully! Redirecting...", "success");

    setTimeout(function () {
        window.location.href = "home.html";
    }, 900);
});

</script>

</body>
</html>
