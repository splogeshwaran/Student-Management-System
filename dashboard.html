<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Student Management System</h1>

<div class="nav">
<a href="home.html">Home</a>
<a href="course.html">Courses</a>
<a href="profile.html">Profile</a>
<a href="dashboard.html" class="active">Dashboard</a>
<a href="login.html">Logout</a>
</div>

<hr>

<h2>Dashboard</h2>
<p class="subtitle" id="greeting">Here's where your learning stands today.</p>

<table id="statsTable">
<tr>
<th>Courses</th>
<th>Attendance</th>
<th>CGPA</th>
<th>Assignments</th>
</tr>
<tr>
<td id="statCourses">0</td>
<td>85%</td>
<td>8.4</td>
<td>4</td>
</tr>
</table>

<h2>Enrolled Courses</h2>

<div id="courseList" class="module-list"></div>

<script type="module">

import { getEnrolledCourses } from './courses.js';
import { showToast } from './app.js';

const courses = getEnrolledCourses();
const list = document.getElementById("courseList");

document.getElementById("statCourses").textContent = courses.length;

if (courses.length === 0) {
    list.innerHTML = `<div class="empty-state">No courses enrolled yet. Head to <a href="course.html">Courses</a> and start a learning path.</div>`;
} else {
    courses.forEach(function (course) {
        // Deterministic "progress" so re-loading the page looks stable
        const seed = course.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
        const progress = 20 + (seed % 70);

        const item = document.createElement("li");
        item.innerHTML = `
            <div>${course}</div>
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
        `;
        list.appendChild(item);
    });

    showToast("Welcome back! You're enrolled in " + courses.length + " course" + (courses.length > 1 ? "s" : "") + ".", "success");
}

</script>

</body>
</html>
