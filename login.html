<!DOCTYPE html>

<title>Login</title>

</head>
<body>

<h1>Student Management System</h1>
<h3>Login to continue your learning path</h3>

<form id="loginForm" novalidate>

    <div class="field" id="userField">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required>
        <div class="error-text">Please enter your username.</div>
    </div>

    <div class="field" id="passField">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <div class="error-text">Password must be at least 4 characters.</div>
    </div>

    <button type="submit">Login</button>
    <a class="btn" href="register.html">Create Account</a>
</form>

<script type="module">
    import { handleLoginSubmit } from './auth.js';

    document.getElementById("loginForm").addEventListener("submit", handleLoginSubmit);
</script>
