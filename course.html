<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

<h1>Student Management System</h1>

<div class="nav">
<a href="home.html">Home</a>
<a href="course.html" class="active">Courses</a>
<a href="profile.html">Profile</a>
<a href="dashboard.html">Dashboard</a>
<a href="login.html">Logout</a>
</div>

<hr>

<h2>Available Courses</h2>
<p class="subtitle">Browse Coursera course overviews, providers, and workloads before you enroll.</p>

<div class="course-grid" id="courseGrid"></div>

<script type="module">

import { loadCourses, loadMoreCourses, enrollCourse, getEnrolledCourses } from './courses.js';

const enrolled = getEnrolledCourses();
const grid = document.getElementById("courseGrid");
const status = document.createElement("p");
status.className = "catalog-status";
status.setAttribute("role", "status");
grid.before(status);
const moreButton = document.createElement("button");
moreButton.type = "button";
moreButton.className = "load-more";
moreButton.textContent = "Load more courses";
moreButton.hidden = true;
grid.after(moreButton);

function addCourseCard(course) {
    const isEnrolled = enrolled.includes(course.name);
    const card = document.createElement("div");
    card.className = "course-card";

    const top = document.createElement("div");
    top.className = "course-card-top";
    const duration = document.createElement("span");
    duration.className = "course-duration";
    duration.textContent = course.duration;
    top.appendChild(duration);
    card.appendChild(top);

    if (course.photoUrl) {
        try {
            const imageUrl = new URL(course.photoUrl);
            if (imageUrl.protocol === "https:") {
                const image = document.createElement("img");
                image.className = "course-image";
                image.src = imageUrl.href;
                image.alt = "";
                image.loading = "lazy";
                card.appendChild(image);
            }
        } catch (error) {
            console.warn("Skipping invalid course image URL.", error);
        }
    }

    const name = document.createElement("div");
    name.className = "course-name";
    name.textContent = course.name;
    const description = document.createElement("p");
    description.className = "course-description";
    description.textContent = course.description || "Explore this course on Coursera.";
    const provider = document.createElement("div");
    provider.className = "course-faculty";
    provider.textContent = "Provider: " + course.faculty;
    card.append(name, description, provider);

    const actions = document.createElement("div");
    actions.className = "course-actions";
    const enrollBtn = document.createElement("button");
    enrollBtn.type = "button";
    enrollBtn.className = "coursebtn" + (isEnrolled ? " enrolled" : "");
    enrollBtn.textContent = isEnrolled ? "Enrolled" : "Enroll";
    const detailsBtn = document.createElement("button");
    detailsBtn.type = "button";
    detailsBtn.className = "pathbtn";
    detailsBtn.textContent = "Course details";
    actions.append(enrollBtn, detailsBtn);
    card.appendChild(actions);

    const details = document.createElement("div");
    details.className = "course-details";
    details.hidden = true;
    const fullDescription = document.createElement("p");
    fullDescription.textContent = course.description || "No course description is available.";
    details.appendChild(fullDescription);
    if (course.url) {
        const link = document.createElement("a");
        link.href = course.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open course on Coursera";
        details.appendChild(link);
    }
    card.appendChild(details);

    enrollBtn.addEventListener("click", function () {
        enrollCourse(course.name, enrollBtn);
    });

    detailsBtn.addEventListener("click", function () {
        details.hidden = !details.hidden;
        detailsBtn.textContent = details.hidden ? "Course details" : "Hide details";
    });

    grid.appendChild(card);
}

function updateStatus() {
    const total = window.COURSE_TOTAL;
    status.textContent = total
        ? "Showing " + grid.children.length + " of " + total.toLocaleString() + " Coursera courses."
        : "Showing " + grid.children.length + " Coursera courses.";
    moreButton.hidden = !window.COURSES_HAS_MORE;
    moreButton.textContent = "Load more courses";
}

async function fetchNextPage(initial) {
    moreButton.disabled = true;
    moreButton.textContent = "Loading…";
    status.textContent = "Loading courses from Coursera…";
    try {
        const addedCourses = initial ? await loadCourses() : await loadMoreCourses();
        addedCourses.forEach(addCourseCard);
        if (!grid.children.length) {
            status.textContent = "Coursera did not return any courses.";
            moreButton.hidden = true;
            return;
        }
        updateStatus();
    } catch (error) {
        status.textContent = "Unable to load courses from Coursera. " +
            (error instanceof Error ? error.message : String(error));
        moreButton.textContent = "Retry";
        moreButton.hidden = false;
    } finally {
        moreButton.disabled = false;
    }
}

moreButton.addEventListener("click", function () {
    fetchNextPage(false);
});

fetchNextPage(true);

</script>

<script src="courses-data.js"></script>
<script src="chatbot.js?v=4"></script>

</body>
</html>
